services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: guytarheroes-web
    restart: unless-stopped
    # ผูกกับ 127.0.0.1 เท่านั้น — เครื่องอื่นในวง LAN และอินเทอร์เน็ตเข้าไม่ถึง
    # ให้ Cloudflare Tunnel เป็นทางเข้าเดียว
    ports:
      - "127.0.0.1:8080:80"

    # ถ้า cloudflared รันเป็น container: ลบ ports: ข้างบนออก แล้วเปิด 3 บรรทัดนี้แทน
    # หาชื่อ network ด้วย: docker inspect <cloudflared> -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
    # networks: [tunnel]
# networks:
#   tunnel:
#     external: true
