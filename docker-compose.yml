services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: guytarheroes-web
    restart: unless-stopped

    # ไม่ publish port ออก host เลย — nginx_proxy_manager คุยผ่าน network นี้ตรง ๆ
    # เช็คว่าเสิร์ฟอยู่ไหมด้วย: docker exec nginx_proxy_manager curl -sI http://guytarheroes-web/
    networks:
      - server_default

networks:
  server_default:
    external: true # สร้างโดย compose ของ cloudflared ไม่ใช่ของ repo นี้
