server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/json;

    # ใช้ expires ไม่ใช่ add_header: nginx จะไม่ตัด header ระดับ server ทิ้ง
    # ไฟล์ใน /_astro/ มี content hash ในชื่ออยู่แล้ว cache ยาวได้ปลอดภัย
    location /_astro/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
