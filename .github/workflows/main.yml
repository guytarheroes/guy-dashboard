# 1. ตั้งชื่อ Workflow (จะไปแสดงในหน้าเว็บ GitHub)
name: My First Workflow

# 2. Event: จะให้ทำงานตอนไหน?
on:
  push:
    branches: [ "main" ] # ทำงานเฉพาะตอนมีคน push ขึ้น branch main

# 3. Jobs: มีงานอะไรบ้างที่ต้องทำ?
jobs:
  say-hello:
    # บอกว่าให้รันคอมพิวเตอร์จำลอง OS อะไรของ GitHub (Linux Ubuntu)
    runs-on: ubuntu-latest

    # Step: ขั้นตอนย่อยในงานนี้
    steps:
      - name: Print welcome message
        run: echo "Hello World! GitHub Actions is working!"

      - name: Print current date and time
        run: date