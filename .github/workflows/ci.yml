name: Node.js CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: ใช้ Action สำเร็จรูปในการดึงโค้ดจาก Repo ลงมาในเครื่องจำลอง
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: ติดตั้ง Node.js ในเครื่องจำลอง
      - name: Setup Node.js
        uses: actions/setup-node@v4 # หรือ actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # runner เป็น amd64 คนละ arch กับ Pi — build ทิ้งเพื่อจับ Dockerfile พังเท่านั้น ไม่ push
      - name: Build Docker image
        run: docker build -f apps/web/Dockerfile -t guytarheroes-web:ci .

      # step นี้จะรันก็ต่อเมื่อ step ข้างบนผ่านหมด (พฤติกรรม default ของ Actions)
      # ส่งค่าผ่าน env ไม่ใช่แปะ ${{ }} ลงใน shell ตรงๆ กัน script injection
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg msg "✅ build ผ่าน — $REPO ($BRANCH) $RUN_URL" '{content: $msg}' \
            | curl -sf -H 'Content-Type: application/json' -d @- "$WEBHOOK"
