name: Node.js CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: ใช้ Action สำเร็จรูปในการดึงโค้ดจาก Repo ลงมาในเครื่องจำลอง
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: ติดตั้ง Node.js ในเครื่องจำลอง
      - name: Setup Node.js
        uses: actions/setup-node@v4 # หรือ actions/setup-node@v4
        with:
          node-version: "22"

      # ponytail: ยังไม่มีแอปใน my-app/ — ข้าม 2 step นี้ไปก่อน
      # พอ commit my-app/package.json เมื่อไหร่ มันจะเริ่มรันเอง ไม่ต้องแก้ไฟล์นี้อีก
      - name: Install dependencies
        working-directory: ./my-app
        run: npm ci

      - name: Build project
        working-directory: ./my-app
        run: npm run build
